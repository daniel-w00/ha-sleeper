.target: &target
  entity:
    integration: sleeper
  device:
    integration: sleeper

player_scored:
  target: *target
  fields:
    side:
      required: true
      default: any
      selector:
        select:
          translation_key: side
          options:
            - any
            - mine
            - opponent
    min_delta:
      required: true
      default: 3
      selector:
        number:
          min: 3
          max: 100
          step: 0.1
          mode: box
          unit_of_measurement: pts

draft_pick_made:
  target: *target
  fields:
    picker:
      required: true
      default: any
      selector:
        select:
          translation_key: picker
          options:
            - any
            - mine
            - others

on_the_clock:
  target: *target
  fields:
    picker:
      required: true
      default: mine
      selector:
        select:
          translation_key: picker
          options:
            - any
            - mine
            - others
