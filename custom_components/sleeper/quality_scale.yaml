# Integration quality scale checklist.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# Statuses: done | todo | exempt (with comment)
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom actions yet.
  appropriate-polling:
    status: done
    comment: Adaptive interval in coordinator.py (60 s while scores change, else 15 min / 1 h); Sleeper's CDN caches responses for 60 s.
  brands:
    status: done
    comment: Placeholder icons shipped in brand/ (served by HA >= 2026.3); replace with final artwork.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: No external requirements; the API client lives in api.py.
  docs-actions:
    status: exempt
    comment: No custom actions yet.
  docs-conditions:
    status: exempt
    comment: No custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers: done
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: todo
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable:
    status: done
    comment: Coordinator raises UpdateFailed on API errors; league entities are unavailable once the league is gone.
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: The Sleeper API needs no authentication.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: Cloud service, nothing to discover.
  discovery:
    status: exempt
    comment: Cloud service, nothing to discover.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: todo
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: done
    comment: New leagues get devices and entities on the hourly league refresh without a reload.
  entity-category: todo
  entity-device-class:
    status: done
    comment: Enum device class where it fits; there is no device class for fantasy points.
  entity-disabled-by-default:
    status: todo
    comment: No secondary entities yet; revisit when phase 2 adds them.
  entity-translations: done
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: done
    comment: Devices of leagues the account is no longer part of are removed on the league refresh.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
