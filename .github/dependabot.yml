version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR per week for all action bumps instead of one PR per action.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Home Assistant is pinned to the production instance on purpose; bump it by hand.
    ignore:
      - dependency-name: homeassistant
      - dependency-name: pytest-homeassistant-custom-component
