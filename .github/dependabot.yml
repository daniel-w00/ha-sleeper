version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Home Assistant is pinned to the production instance on purpose; bump it by hand.
    ignore:
      - dependency-name: homeassistant
      - dependency-name: pytest-homeassistant-custom-component
